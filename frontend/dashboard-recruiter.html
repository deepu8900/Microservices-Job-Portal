<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JobPortal - Recruiter Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="navbar">
    <div class="brand">JobPortal</div>
    <div class="nav-actions">
        <span id="welcomeText"></span>
        <button class="secondary" onclick="logout()">Log out</button>
    </div>
</div>

<div class="container">
    <div class="section-title">
        <span>My job postings</span>
        <button onclick="openPostModal()">+ Post a job</button>
    </div>

    <div id="jobsList"></div>

    <div class="section-title" style="margin-top:40px;">Applicants</div>
    <div id="applicantsPanel">
        <p class="empty-state">Click "View applicants" on a job posting to see candidates.</p>
    </div>
</div>

<div class="modal-overlay" id="postModal">
    <div class="modal">
        <h3>Post a new job</h3>
        <form id="postJobForm">
            <label>Title</label>
            <input type="text" id="jobTitle" required />

            <label>Company</label>
            <input type="text" id="jobCompany" required />

            <label>Location</label>
            <input type="text" id="jobLocation" />

            <label>Salary</label>
            <input type="number" id="jobSalary" />

            <label>Description</label>
            <textarea id="jobDescription" rows="4"></textarea>

            <div class="modal-actions">
                <button type="button" class="secondary" onclick="closePostModal()">Cancel</button>
                <button type="submit">Publish</button>
            </div>
        </form>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    const user = requireAuth("RECRUITER");
    document.getElementById("welcomeText").textContent = `Hi, ${user.fullName}`;

    function openPostModal() {
        document.getElementById("postModal").classList.add("open");
    }

    function closePostModal() {
        document.getElementById("postModal").classList.remove("open");
        document.getElementById("postJobForm").reset();
    }

    document.getElementById("postJobForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
            await apiRequest("/jobs", {
                method: "POST",
                body: JSON.stringify({
                    title: document.getElementById("jobTitle").value,
                    company: document.getElementById("jobCompany").value,
                    location: document.getElementById("jobLocation").value,
                    salary: document.getElementById("jobSalary").value ? Number(document.getElementById("jobSalary").value) : null,
                    description: document.getElementById("jobDescription").value,
                    recruiterId: user.userId
                })
            });
            closePostModal();
            loadJobs();
        } catch (err) {
            alert(err.message);
        }
    });

    async function loadJobs() {
        const list = document.getElementById("jobsList");
        list.innerHTML = "<p class='empty-state'>Loading your jobs...</p>";

        try {
            const jobs = await apiRequest(`/jobs/recruiter/${user.userId}`);
            if (jobs.length === 0) {
                list.innerHTML = "<p class='empty-state'>You haven't posted any jobs yet.</p>";
                return;
            }

            list.innerHTML = jobs.map(job => `
                <div class="card">
                    <h3>${job.title}</h3>
                    <div class="meta">${job.location || "Remote"} ${job.salary ? "• $" + job.salary : ""} • <span class="badge success">${job.status}</span></div>
                    <p>${job.description || ""}</p>
                    <div class="modal-actions" style="justify-content:flex-start; margin-top:16px;">
                        <button class="secondary" onclick="loadApplicants(${job.id}, ${JSON.stringify(job.title)})">View applicants</button>
                    </div>
                </div>
            `).join("");
        } catch (err) {
            list.innerHTML = `<p class='empty-state'>${err.message}</p>`;
        }
    }

    async function loadApplicants(jobId, title) {
        const panel = document.getElementById("applicantsPanel");
        panel.innerHTML = "<p class='empty-state'>Loading applicants...</p>";

        try {
            const applications = await apiRequest(`/applications/job/${jobId}`);
            if (applications.length === 0) {
                panel.innerHTML = `<p class='empty-state'>No applicants yet for ${title}.</p>`;
                return;
            }

            panel.innerHTML = applications.map(app => `
                <div class="card">
                    <h3>${app.candidateName}</h3>
                    <div class="meta">${app.candidateEmail} • Applied ${new Date(app.appliedAt).toLocaleDateString()}</div>
                    <span class="badge">${app.status}</span>
                    <div class="modal-actions" style="justify-content:flex-start; margin-top:12px;">
                        <button onclick="updateStatus(${app.id}, 'SHORTLISTED', ${jobId}, ${JSON.stringify(title)})">Shortlist</button>
                        <button class="secondary" onclick="updateStatus(${app.id}, 'REJECTED', ${jobId}, ${JSON.stringify(title)})">Reject</button>
                    </div>
                </div>
            `).join("");
        } catch (err) {
            panel.innerHTML = `<p class='empty-state'>${err.message}</p>`;
        }
    }

    async function updateStatus(applicationId, status, jobId, title) {
        try {
            await apiRequest(`/applications/${applicationId}/status?status=${status}`, {
                method: "PATCH"
            });
            loadApplicants(jobId, title);
        } catch (err) {
            alert(err.message);
        }
    }

    loadJobs();
</script>

</body>
</html>
